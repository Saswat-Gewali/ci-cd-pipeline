# CI/CD Pipeline for the Tip and Bill Splitter.
#
# Three stages run in sequence: test, then build, then deploy. Each stage is
# gated on the one before it, so a commit that fails its tests never gets built
# and a commit that fails to build never gets published.
name: CI/CD Pipeline

# When this pipeline runs.
on:
  # Every push to main, which is the branch that will eventually deploy.
  push:
    branches: [main]
  # Every pull request that targets main, so a branch is checked before merging.
  pull_request:
    branches: [main]

# Read only access to the repo is all the test job needs. Setting this at the
# top level replaces the default token permissions with the minimum, and later
# jobs that need more (the deploy job needs to write to Pages) will ask for it
# themselves rather than everything being granted here.
permissions:
  contents: read

jobs:
  test:
    name: Test
    # A GitHub hosted Ubuntu runner, a clean throwaway virtual machine that is
    # created for this job and destroyed when it finishes. Nothing carries over
    # from a previous run, which is what makes the result trustworthy.
    runs-on: ubuntu-latest

    steps:
      # Copy the repository onto the runner. Without this the runner is empty,
      # because it starts with no knowledge of your code at all.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Install Node.js and turn on dependency caching. 'lts/*' resolves to the
      # current Long Term Support release, so the pipeline follows Node LTS
      # without this file needing an edit every year. cache: 'npm' saves the npm
      # download cache between runs, keyed on package-lock.json, which makes the
      # install step much faster on later runs.
      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # Install dependencies exactly as package-lock.json pins them. npm ci is
      # the CI counterpart of npm install: it deletes node_modules first, will
      # not silently update the lockfile, and fails if the lockfile and
      # package.json disagree. That is what makes a CI run reproducible.
      - name: Install dependencies
        run: npm ci

      # Run the Vitest suite once, in non watch mode (the "test" script is
      # "vitest run"). A failing test exits non zero, which fails this step,
      # which fails the job and marks the whole pipeline red.
      - name: Run unit tests
        run: npm test

  build:
    name: Build
    # This is the gate. 'needs: test' tells Actions that build depends on test,
    # so build does not start until test has finished successfully. If test
    # fails, build is skipped entirely rather than failing, and the deploy job
    # we add next will hang off build the same way. Without this line the two
    # jobs would run at the same time, and broken code could still be built.
    needs: test

    # A brand new Ubuntu runner. Jobs do not share a machine, so nothing the
    # test job installed or produced exists here. That is why this job has to
    # check out the code and install dependencies again from scratch.
    runs-on: ubuntu-latest

    # Job level permissions override the top level 'contents: read' for this job
    # only. configure-pages reads the repository's Pages settings through the
    # API, which the token cannot do unless it is granted pages access. Read is
    # enough here: only the deploy job will need pages: write.
    permissions:
      contents: read
      pages: read

    steps:
      # Copy the repository onto this runner, exactly as the test job did.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Same Node setup as the test job. The npm cache is shared across jobs in
      # the same repo, keyed on package-lock.json, so this restores the cache
      # the test job just warmed up rather than downloading everything again.
      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # Install from the lockfile again. Vite itself is a devDependency, so the
      # build cannot run until the dependencies are present on this machine.
      - name: Install dependencies
        run: npm ci

      # Read the repository's GitHub Pages settings and expose them as outputs
      # (base_url, base_path, host, origin).
      #
      # A caveat worth knowing: this action can only auto configure the base
      # path for Next, Nuxt, Gatsby, and SvelteKit. Vite is not on that list, so
      # it does not touch our build. We do not need it to, because
      # vite.config.js sets base: './', which emits relative asset paths that
      # work at any Pages subpath.
      #
      # It earns its place for a different reason: it fails immediately, with a
      # clear message, if Pages is not enabled or is not set to "GitHub
      # Actions". Without it that mistake surfaces much later, in the deploy
      # job, with a far more cryptic error.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Produce the production build: Vite bundles and minifies the app into
      # dist/. This is the step that catches problems the unit tests cannot see,
      # such as a broken import path or a syntax error in a file that no test
      # happens to import. A failed build exits non zero and stops the pipeline.
      - name: Build the production bundle
        run: npm run build

      # Lift dist/ off this runner and store it with the workflow run.
      #
      # This is the step that makes deployment possible at all. This runner is
      # destroyed the moment the job ends, taking dist/ with it, and the deploy
      # job runs on a completely different machine. Uploading packs dist/ into a
      # tar archive that outlives the runner, so the deploy job can pull it down
      # by name.
      #
      # The path input is required here: the action defaults to '_site/', which
      # is the Jekyll convention, so pointing it at Vite's './dist' is what
      # makes it find our files. The artifact is named 'github-pages' by
      # default, which is the exact name actions/deploy-pages looks for.
      - name: Upload dist as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy
    # The second gate. Deploy waits for build, which itself waits for test, so
    # the full chain is test to build to deploy. Nothing reaches the live site
    # unless every stage before it passed.
    needs: build

    # Only publish from a real push to main. Pull request runs still get tested
    # and built, which is the point of checking a branch before merging, but
    # they must not overwrite the live site with unreviewed code.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Least privilege, granted per job rather than to the whole workflow:
    #   contents: read   clone the repo, the baseline every job needs
    #   pages: write     create a new GitHub Pages deployment
    #   id-token: write  mint a short lived OIDC token that proves to Pages that
    #                    this specific workflow run is the one asking to deploy
    # Only this job can touch Pages. If the test or build job were ever
    # compromised, neither could publish anything, because their tokens simply
    # do not carry these rights.
    permissions:
      contents: read
      pages: write
      id-token: write

    # A deployment environment. Naming it github-pages is what makes the run
    # show as a real deployment rather than an ordinary job, and it is the
    # environment the Pages service expects. The url is filled in from the
    # deploy step's own output, so the live link appears on the run summary and
    # in the repository sidebar once the job finishes.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    # Let one deployment finish before the next begins. Two pushes landing close
    # together would otherwise try to publish at the same time and one would
    # fail. cancel-in-progress stays false so an in flight deployment is allowed
    # to complete rather than being abandoned half done.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      # Publish the artifact the build job uploaded.
      #
      # There is no checkout and no npm install here, because this job does not
      # need your source at all. It downloads the 'github-pages' artifact by
      # name, hands it to the Pages service, and waits for the site to go live.
      #
      # The id is what makes the environment url above work: it lets the
      # environment block read this step's page_url output.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
