<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip and Bill Splitter</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1b1f24;
        --muted: #5c6773;
        --line: #d9dee5;
        --accent: #1f6feb;
        --surface: #ffffff;
        --ground: #f4f6f9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8edf3;
          --muted: #9aa7b4;
          --line: #2c333c;
          --accent: #6aa8ff;
          --surface: #1a1e24;
          --ground: #101317;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--ground);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
      }
      h1 { margin: 0 0 4px; font-size: 1.35rem; }
      p.sub { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
      label { display: block; margin-bottom: 14px; font-size: 0.85rem; color: var(--muted); }
      input {
        width: 100%;
        margin-top: 4px;
        padding: 10px 12px;
        font-size: 1rem;
        color: inherit;
        background: var(--ground);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .results {
        margin-top: 20px;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      .row { display: flex; justify-content: space-between; padding: 7px 0; }
      .row dt { color: var(--muted); font-size: 0.9rem; }
      .row dd { margin: 0; font-variant-numeric: tabular-nums; }
      .row.each { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
      .row.each dt { color: var(--ink); font-weight: 600; }
      .row.each dd { font-size: 1.3rem; font-weight: 600; color: var(--accent); }
      .note { margin: 12px 0 0; min-height: 1.25rem; font-size: 0.85rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Tip and Bill Splitter</h1>
      <p class="sub">Work out the tip, the total, and what each person owes.</p>

      <label for="bill">
        Bill amount
        <input id="bill" type="number" min="0" step="0.01" value="100" inputmode="decimal" />
      </label>

      <label for="tip">
        Tip percentage
        <input id="tip" type="number" min="0" step="1" value="15" inputmode="numeric" />
      </label>

      <label for="people">
        Number of people
        <input id="people" type="number" min="1" step="1" value="2" inputmode="numeric" />
      </label>

      <dl class="results">
        <div class="row"><dt>Tip</dt><dd id="tip-amount">$0.00</dd></div>
        <div class="row"><dt>Total</dt><dd id="total-amount">$0.00</dd></div>
        <div class="row each"><dt>Each person pays</dt><dd id="per-person">$0.00</dd></div>
      </dl>

      <p class="note" id="note" role="status"></p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
